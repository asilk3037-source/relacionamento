# Fly.io: `fly launch --no-deploy --copy-config`, `fly volumes create elo_data --size 1`, `fly secrets set MEDIA_SECRET=$(openssl rand -hex 32)`, `fly deploy`
app = "elo-app-troque-o-nome"
primary_region = "gru"

[build]

[env]
  PORT = "8080"
  NODE_ENV = "production"
  DB_PATH = "/data/elo.db"
  UPLOAD_DIR = "/data/uploads"
  REQUIRE_EMAIL_VERIFICATION = "false"   # sem provedor de e-mail ainda; mude para true quando houver
  AUTO_APPROVE_PHOTOS = "false"          # fotos passam por moderação em /admin/

[[mounts]]
  source = "elo_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  min_machines_running = 1
  [http_service.checks]
  [[http_service.checks]]
    path = "/healthz"
    interval = "30s"
    timeout = "5s"
