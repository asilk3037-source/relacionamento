const people=[{id:1,name:'Marina',age:28,gender:'Mulheres',distance:3,intent:'Relacionamento',bio:'Café sem pressa, música ao vivo e uma boa conversa. Qual cantinho de BH você me apresentaria?',tags:['Café','Música','Arte'],color:'#b9cee9',skin:'#ad7154',hair:'#392c25',shirt:'#365d9e',mutual:true},{id:2,name:'Rafael',age:31,gender:'Homens',distance:8,intent:'Conhecer pessoas',bio:'Entre uma trilha e um cinema, sempre cabe um pão de queijo.',tags:['Trilhas','Cinema','Cozinhar'],color:'#c3d6eb',skin:'#78503c',hair:'#292721',shirt:'#324d78',mutual:true},{id:3,name:'Júlia',age:26,gender:'Mulheres',distance:12,intent:'Relacionamento',bio:'Livros na mochila e vontade de descobrir a próxima exposição.',tags:['Livros','Arte','Viagens'],color:'#c0cfe8',skin:'#d7a17e',hair:'#784832',shirt:'#394b58',mutual:false},{id:4,name:'Lucas',age:29,gender:'Homens',distance:18,intent:'Algo casual',bio:'Domingo de feira, fotografia de rua e uma boa playlist.',tags:['Fotografia','Música','Café'],color:'#c8d4e7',skin:'#bd8b65',hair:'#302b24',shirt:'#456998',mutual:false}];
function portrait(p){return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 480"><rect width="400" height="480" fill="${p.color}"/><circle cx="310" cy="95" r="95" fill="#ffffff" opacity=".2"/><path d="M0 340 400 240v240H0Z" fill="#ffffff" opacity=".15"/><path d="M60 480c0-140 45-172 140-172s140 32 140 172" fill="${p.shirt}"/><path d="M170 278h60v57c-15 25-45 25-60 0" fill="${p.skin}"/><ellipse cx="200" cy="196" rx="79" ry="108" fill="${p.hair}"/><ellipse cx="200" cy="216" rx="64" ry="83" fill="${p.skin}"/><path d="M133 205c-12-107 125-143 136 5-34-15-55-52-57-75-9 34-42 63-79 70" fill="${p.hair}"/><path d="M163 216q10-8 20 0m34 0q10-8 20 0" stroke="#332a23" stroke-width="4" fill="none" stroke-linecap="round"/><path d="M183 259q17 13 34-2" stroke="#5a3029" stroke-width="4" fill="none" stroke-linecap="round"/><path d="m199 222-5 22h10" stroke="#754a37" opacity=".5" fill="none" stroke-width="3"/><path d="M125 365q75 45 150 0" stroke="#fff" opacity=".2" fill="none" stroke-width="2"/></svg>`}
function pic(p,cls='portrait'){return `<img class="${cls}" alt="Ilustração de ${p.name}, perfil fictício adulto" src="data:image/svg+xml,${encodeURIComponent(portrait(p))}">`}
let state={view:'discover',seen:[],blocked:[],matches:[2],cross:true,radius:25,gender:'Todos',intent:'Todas',name:'Alex',messages:{2:[{text:'Oi! Vi que você também gosta de café. Tem algum favorito por aqui?',mine:false}]},selected:2};
const $=id=>document.getElementById(id);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(t){$('toast').textContent=t;$('toast').classList.remove('hidden');clearTimeout(window.tt);window.tt=setTimeout(()=>$('toast').classList.add('hidden'),3200)}
function showPage(v){modal('<h2>Seus dados, suas escolhas.</h2><p>Este protótipo não coleta localização e mantém as interações apenas durante esta sessão.</p><p>No aplicativo, você poderá pausar a descoberta, revogar consentimentos e excluir sua conta.</p>')}
function go(v){state.view=v;render()}
function modal(content){$('modal').innerHTML='<button class="close" aria-label="Fechar" onclick="closeModal()">×</button>'+content;$('modal').showModal()}
function closeModal(){$('modal').close()}
function candidates(){return people.filter(p=>!state.seen.includes(p.id)&&!state.blocked.includes(p.id)&&!state.matches.includes(p.id)&&p.distance<=state.radius&&(state.gender==='Todos'||p.gender===state.gender)&&(state.intent==='Todas'||p.intent===state.intent))}
function head(t,s,action=''){return `<div class="panelhead"><div><div class="eyebrow">Belo Horizonte</div><h2>${t}</h2></div>${action}</div><div class="sub">${s}</div>`}
function card(p){return `<div class="card">${pic(p)}<div class="cardinfo"><span class="badge">${p.intent}</span><h3>${p.name}, ${p.age}</h3><span>Na sua região · ${p.distance<=5?'menos de 5':p.distance<=10?'5–10':'10–25'} km</span></div></div><div class="tags">${p.tags.map(x=>'<span class="tag">'+x+'</span>').join('')}</div><p class="sub">${p.bio}</p>`}
function row(p,fn,sub){return `<button class="listrow" onclick="${fn}">${pic(p,'avatar')}<span class="grow"><b>${p.name}, ${p.age}</b><small>${sub}</small></span><span>↗</span></button>`}
function react(id,like){if(!like)lastPassed=id;state.seen.push(id);const p=people.find(p=>p.id===id);if(like&&p.mutual&&!state.matches.includes(id)){state.matches.push(id);state.messages[id]=[];render();modal(`<div class="eyebrow">Interesse mútuo · simulação</div><h2>Um novo elo!</h2>${pic(p,'avatar')}<p>Você e ${p.name} se curtiram. Uma boa conversa pode começar agora.</p><button class="primary" onclick="closeModal();openChat(${id})">Dar o primeiro oi</button>`)}else{render();toast(like?'Curtida registrada nesta demonstração.':'Próximo perfil.')}}
function filters(){modal(`<h2>Seu tipo de conexão.</h2><form onsubmit="applyFilters(event)"><label for="radius">Distância máxima</label><select id="radius">${[5,10,25,50].map(x=>`<option ${state.radius===x?'selected':''} value="${x}">${x} km</option>`).join('')}</select><label for="gender">Quem você quer conhecer?</label><select id="gender">${['Todos','Mulheres','Homens'].map(x=>`<option ${state.gender===x?'selected':''}>${x}</option>`).join('')}</select><label for="intent">Intenção</label><select id="intent">${['Todas','Relacionamento','Conhecer pessoas','Algo casual'].map(x=>`<option ${state.intent===x?'selected':''}>${x}</option>`).join('')}</select><p class="sub">Opções reduzidas para o protótipo. O produto final terá identidade e preferências inclusivas.</p><button class="primary" type="submit">Aplicar filtros</button></form>`)}
function applyFilters(e){e.preventDefault();state.radius=+$('radius').value;state.gender=$('gender').value;state.intent=$('intent').value;closeModal();render();toast('Filtros aplicados aos perfis fictícios.')}
function detail(id){let p=people.find(x=>x.id===id);modal(`<h2>${p.name}, ${p.age}</h2><div style="height:210px;overflow:hidden;border-radius:15px">${pic(p)}</div><p>${p.bio}</p><button class="primary" onclick="closeModal();react(${id},true)">Curtir perfil</button> <button class="smallbutton" onclick="safety(${id})">Bloquear ou denunciar</button>`)}
function safety(id){modal(`<h2>Você no controle.</h2><p>Bloquear remove o perfil e a conversa da demonstração.</p><button class="secondary danger" onclick="block(${id})">Bloquear perfil</button><form onsubmit="report(event,${id})"><label for="reason">Motivo da denúncia</label><select id="reason"><option>Assédio ou comportamento inadequado</option><option>Suspeita de menor de idade</option><option>Perfil falso ou golpe</option><option>Outro motivo</option></select><label for="reporttext">Detalhes (opcional)</label><textarea id="reporttext" maxlength="1000"></textarea><p class="sub">Teste local: nenhum relato será enviado a uma equipe.</p><button class="primary" type="submit">Simular denúncia e bloquear</button></form>`)}
function block(id){state.blocked.push(id);state.matches=state.matches.filter(x=>x!==id);delete state.messages[id];closeModal();go('discover');toast('Perfil bloqueado nesta demonstração.')}
function report(e,id){e.preventDefault();block(id);toast('Denúncia simulada e perfil bloqueado. Nenhum envio real.')}
function openChat(id){state.selected=id;state.view='conversation';render()}
function send(e){e.preventDefault();let v=$('message').value.trim();if(!v)return;state.messages[state.selected]??=[];state.messages[state.selected].push({text:v,mine:true});render();$('message').focus();$('messages').scrollTop=$('messages').scrollHeight}
function invitation(){modal('<h2>Bora tomar um café?</h2><p>Proposta de encontro em local público, para ser combinada pelos dois.</p><button class="primary" onclick="invite()">Inserir convite na conversa</button><p class="sub">Demonstração: não reserva local nem confirma presença.</p>')}
function invite(){state.messages[state.selected]??=[];state.messages[state.selected].push({text:'Bora tomar um café? Podemos combinar um lugar público e um horário por aqui.',mine:true});closeModal();render()}
function toggleCross(){state.cross=!state.cross;render();toast(state.cross?'Cruzamentos fictícios ativados. Nenhum GPS foi acessado.':'Cruzamentos pausados.')}
function reset(){state.seen=[];state.blocked=[];state.matches=[2];state.messages={2:[]};state.name='Alex';state.cross=true;state.radius=25;state.gender='Todos';state.intent='Todas';closeModal();go('discover');toast('Dados da demonstração reiniciados.')}
function render(){ $('navigation').innerHTML=names.map(([v,t])=>`<button class="${state.view===v||(v==='chat'&&state.view==='conversation')?'active':''}" onclick="go('${v}')" ${state.view===v?'aria-current="page"':''}>${icon(v)}${t}</button>`).join('')+'<p class="note">✳ Uma boa conexão começa com liberdade para escolher.</p>';let s='';
if(state.view==='discover'){const p=candidates()[0];s=head('Novos encontros','Conheça pessoas no seu ritmo.',`<button class="pill" onclick="filters()">Filtros</button>`)+(p?card(p)+`<div class="actions"><button class="circle" aria-label="Passar ${p.name}" onclick="react(${p.id},false)">×</button><button class="circle like" aria-label="Curtir ${p.name}" onclick="react(${p.id},true)">♡</button><button class="circle" aria-label="Mais opções para ${p.name}" onclick="safety(${p.id})">⋯</button></div>`:`<div class="empty"><span class="spark">✳</span><h3>Por aqui, você viu todos.</h3><p class="sub">Experimente outros filtros ou reveja os perfis que passou.</p><button class="secondary" onclick="state.seen=[];render()">Rever perfis</button><button class="smallbutton" onclick="filters()">Ajustar filtros</button></div>`)}
if(state.view==='paths'){s=head('Pelo seu caminho','Possibilidades de reencontro, sem localização exata.')+`<svg class="route-art" viewBox="0 0 400 130" aria-label="Ilustração abstrata de caminhos, não é um mapa real"><path d="M-10 85C80-20 125 165 220 50s120 60 200-10M-20 20C100 100 160-20 210 95s100-50 210 10" fill="none" stroke="#ccdbf2" stroke-width="22"/><path d="M-10 85C80-20 125 165 220 50s120 60 200-10" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="7 7"/><circle cx="190" cy="75" r="14" fill="#2563eb"/><circle cx="190" cy="75" r="5" fill="white"/></svg><div class="switchline"><b>${state.cross?'Caminhos ativados':'Caminhos pausados'}</b><button class="secondary" onclick="toggleCross()">${state.cross?'Pausar':'Ativar'}</button></div><p class="sub">Neste protótipo, os cruzamentos são fictícios. Nenhuma localização é coletada.</p>`+(state.cross?people.filter(p=>!state.blocked.includes(p.id)).slice(0,3).map(p=>row(p,`detail(${p.id})`,'Vocês podem ter cruzado caminhos recentemente.')).join(''):'<div class="empty"><h3>Uma pausa também faz bem.</h3><p>Você ainda pode conhecer pessoas em Descobrir.</p></div>')}
if(state.view==='matches'||state.view==='chat'){let ps=people.filter(p=>state.matches.includes(p.id)&&!state.blocked.includes(p.id));s=head(state.view==='matches'?'Deu conexão.':'Boas conversas','Interesse mútuo é só o começo.')+ps.map(p=>row(p,`openChat(${p.id})`,state.messages[p.id]?.length?'Continuar conversa':'Que tal dar o primeiro oi?')).join('')+(!ps.length?'<div class="empty">Seus novos matches aparecerão aqui.</div>':'')+'<p class="demo-label">Matches e mensagens simulados, sem usuários reais.</p>'}
if(state.view==='conversation'){let p=people.find(x=>x.id===state.selected);s=`<button class="smallbutton" onclick="go('chat')">← Conversas</button>`+head(p.name,'Match fictício · mensagens somente nesta página',`<button class="menu" aria-label="Segurança da conversa" onclick="safety(${p.id})">⋯</button>`)+`<div id="messages" class="messages">${(state.messages[p.id]||[]).map(m=>`<div class="msg ${m.mine?'mine':''}">${esc(m.text)}</div>`).join('')||'<p class="sub">Comece com algo que vocês têm em comum.</p>'}</div><button class="pill" onclick="invitation()">☕ Bora tomar um café?</button><form class="send" onsubmit="send(event)" style="margin-top:18px"><input id="message" aria-label="Mensagem" placeholder="Escreva seu primeiro oi…" maxlength="2000" required autocomplete="off"><button class="primary" type="submit" aria-label="Enviar mensagem local">↑</button></form><p class="sub">Envio local de demonstração. Não há destinatário real.</p>`}
if(state.view==='profile'){s=head('Meu espaço','Você escolhe como quer aparecer.')+`<div class="setting"><label for="myname">Nome de exibição</label><input id="myname" maxlength="40" value="${esc(state.name)}"><button class="smallbutton" onclick="state.name=$('myname').value.trim()||'Alex';toast('Nome salvo nesta sessão.');render()">Salvar nome</button><p class="sub">Olá, ${esc(state.name)}. Seu perfil de demonstração tem 28 anos.</p></div><div class="setting switchline"><span><b>Caminhos cruzados</b><br><small>Controle separado de descoberta</small></span><button class="secondary" onclick="toggleCross()">${state.cross?'Pausar':'Ativar'}</button></div><div class="setting"><button class="smallbutton" onclick="filters()">Editar preferências de descoberta</button></div><div class="setting"><b>Localização protegida</b><p class="sub">No app final, consentimento e permissão serão solicitados antes da coleta. Esta página não usa GPS.</p></div><div class="setting"><button class="smallbutton" onclick="showPage('doc')">Como seus dados serão tratados ↗</button></div><button class="smallbutton danger" onclick="modal('<h2>Limpar demonstração?</h2><p>As interações locais serão reiniciadas. Não existe conta real para excluir.</p><button class=&quot;primary&quot; onclick=&quot;reset()&quot;>Confirmar limpeza</button>')">Limpar dados da demonstração</button>`}
$('screen').innerHTML=s;}

const baseRender=render;
render=function(){baseRender();$('screen').className='panel view-'+state.view;$('screen').scrollTop=0;if(state.view==='discover'){let c=$('screen').querySelector('.card');if(c){let start=null;c.style.touchAction='pan-y';c.addEventListener('pointerdown',e=>{start=e.clientX});c.addEventListener('pointerup',e=>{if(start===null)return;let dx=e.clientX-start;start=null;if(Math.abs(dx)>70){let p=candidates()[0];if(p)react(p.id,dx>0)}});c.addEventListener('pointercancel',()=>start=null)}}};
function onboarding(){modal('<div class="eyebrow">Bem-vindo ao elo</div><h2>Conexões que fazem sentido.</h2><p>Explore perfis, curta e converse quando o interesse for mútuo.</p><p>Em Caminhos, veja como seria reencontrar alguém da sua região.</p><p class="sub">Demonstração 18+ com pessoas fictícias. Sem GPS, pagamentos ou mensagens reais.</p><button class="primary" onclick="closeModal()">Começar a explorar</button>')}

let membership='free',billingCycle='month',membershipCycle='month',lastPassed=null,incognito=false,boostUsed=false;
const planNames={free:'Elo Free',plus:'Elo Plus',premium:'Elo Premium'};
const fees={plus:{month:19.90,year:179.90},premium:{month:34.90,year:299.90}};
const brl=n=>n.toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
function setCycle(c){billingCycle=c;render()}
function planCard(id){const yearly=billingCycle==='year';let amount=fees[id][billingCycle];let extras=id==='plus'?['Veja quem curtiu você','Desfaça o último perfil dispensado','Match e conversa continuam livres']:['Tudo do Elo Plus','Modo discreto: apareça só para quem curtir','1 destaque de 30 minutos por semana'];return `<section class="pricecard ${id}"><span class="plan-ribbon">${id==='plus'?'MAIS CONTROLE':'MAIS POSSIBILIDADES'}</span><div class="planlabel">${planNames[id]}</div><div class="price">${brl(amount)}<small> / ${yearly?'ano':'mês'}</small></div><div class="billing">${yearly?`${brl(amount/12)}/mês equivalente · cobrança anual única`:'Cobrança mensal · renovação automática proposta'}</div><ul>${extras.map(x=>'<li>'+x+'</li>').join('')}</ul><button class="primary" onclick="choosePlan('${id}')">${membership===id?'Revisar plano':'Conhecer '+planNames[id]}</button></section>`}
function plansScreen(){return `<div class="panelhead"><h2>Seu próximo elo.</h2><button class="smallbutton" onclick="managePlan()">Meu plano</button></div><div class="planshero"><span class="eyebrow">ELO PLUS & PREMIUM</span><h2>Mais possibilidades.<br>No seu ritmo.</h2><p>Escolha os extras que combinam com a sua forma de conhecer pessoas.</p></div><div class="cycle" role="group" aria-label="Período do plano"><button class="${billingCycle==='month'?'chosen':''}" aria-pressed="${billingCycle==='month'}" onclick="setCycle('month')">Mensal</button><button class="${billingCycle==='year'?'chosen':''}" aria-pressed="${billingCycle==='year'}" onclick="setCycle('year')">Anual · menor valor por mês</button></div><p class="legalnote">Preços propostos para teste. Este protótipo não faz cobranças.</p>${planCard('plus')}${planCard('premium')}<div class="free-summary"><b>Elo Free · R$ 0</b><p>Descubra pessoas, curta, dê match e converse. Caminhos cruzados, bloquear, denunciar e controlar a localização continuam gratuitos.</p><button class="smallbutton" onclick="go('discover')">Continuar explorando</button></div><h3>Compare antes de escolher</h3><table class="compare"><tr><th>Recurso</th><th>Free</th><th>Plus</th><th>Premium</th></tr><tr><td>Match e chat</td><td>✓</td><td>✓</td><td>✓</td></tr><tr><td>Caminhos e segurança</td><td>✓</td><td>✓</td><td>✓</td></tr><tr><td>Ver curtidas e desfazer</td><td>—</td><td>✓</td><td>✓</td></tr><tr><td>Discreto e destaque</td><td>—</td><td>—</td><td>✓</td></tr></table><p class="legalnote">Modelo proposto: renovação no período escolhido até cancelamento. No app Android, a compra e a gestão serão feitas pelo Google Play. Sem promessa de matches. Benefícios e preços sujeitos à validação antes do lançamento.</p>`}
function choosePlan(id){const c=billingCycle;modal(`<div class="eyebrow">Resumo da simulação</div><h2>${planNames[id]}</h2><p class="modal-price">${brl(fees[id][c])} / ${c==='year'?'ano':'mês'}</p><p>${c==='year'?'Pagamento anual único. O valor mensal equivalente não é parcelamento.':'Pagamento mensal.'} No produto final, a assinatura seria renovada automaticamente até cancelamento.</p><p>Você pode cancelar a renovação e manter os benefícios até o fim do período pago. A troca de plano deverá ser confirmada pela loja.</p><p class="demo-label">Nenhum pagamento real. Sem cartão ou conta da loja.</p><button class="primary" onclick="activatePlan('${id}','${c}')">Simular ativação</button><button class="smallbutton" onclick="closeModal()">Agora não</button>`)}
function activatePlan(id,c){membership=id;membershipCycle=c;closeModal();go('profile');toast(planNames[id]+' ativado apenas na demonstração.')}
function visitPlans(){closeModal();go('plans')}
function cancelDemo(){membership='free';incognito=false;boostUsed=false;closeModal();go('profile');toast('Simulação encerrada. Plano Free ativo.')}
function managePlan(){let actions=membership==='free'?'<button class="primary" onclick="visitPlans()">Explorar planos</button>':'<button class="primary" onclick="cancelDemo()">Encerrar simulação paga</button>';modal(`<h2>Seu plano</h2><p><b>${planNames[membership]}</b></p><p>${membership==='free'?'Você usa os recursos gratuitos.':brl(fees[membership][membershipCycle])+' por '+(membershipCycle==='year'?'ano':'mês')+' · assinatura simulada'}</p><p class="sub">Na versão real, a gestão abre as assinaturas do Google Play. Aqui você pode voltar ao Free imediatamente para testar.</p>${actions}`)}
function gate(feature){modal(`<div class="eyebrow">Extra opcional</div><h2>${feature}</h2><p>Este recurso está disponível nos planos pagos. Você continua podendo curtir perfis e conversar após o match no Free.</p><button class="primary" onclick="closeModal();go('plans')">Comparar planos</button><button class="smallbutton" onclick="closeModal()">Continuar no Free</button>`)}
function undoPass(){if(membership==='free'){gate('Dê uma segunda olhada.');return}if(lastPassed===null){toast('Nenhum perfil dispensado para desfazer.');return}state.seen=state.seen.filter(x=>x!==lastPassed);lastPassed=null;go('discover');toast('Último perfil dispensado voltou à descoberta.')}
function showLikes(){if(membership==='free'){gate('Veja quem curtiu você.');return}let ps=people.filter(p=>p.mutual&&!state.blocked.includes(p.id)&&!state.matches.includes(p.id));modal('<h2>Quem curtiu você</h2><p class="sub">Curtidas fictícias desta demonstração.</p>'+ps.map(p=>row(p,`detail(${p.id})`,'Gostou do seu perfil')).join('')+(!ps.length?'<p>Nenhuma nova curtida por aqui.</p>':''))}
function toggleIncognito(){if(membership!=='premium'){gate('Conheça no modo discreto.');return}incognito=!incognito;render();toast(incognito?'Modo discreto simulado ativado.':'Modo discreto desativado.')}
function useBoost(){if(membership!=='premium'){gate('Um pouco mais de destaque.');return}if(boostUsed){toast('Destaque semanal já usado nesta simulação.');return}boostUsed=true;render();toast('Destaque de 30 minutos simulado. Não há exposição real.')}
const mobileRender=render;
render=function(){mobileRender();if(state.view==='plans'){$('screen').innerHTML=plansScreen();$('screen').className='panel view-plans'}if(state.view==='discover'){let a=$('screen').querySelector('.actions');if(a)a.insertAdjacentHTML('afterbegin','<button class="circle undo" aria-label="Desfazer último perfil" onclick="undoPass()">↶</button>')}if(state.view==='matches'){$('screen').insertAdjacentHTML('afterbegin','<button class="upgrade-banner" onclick="showLikes()"><span><b>Quem curtiu você?</b>Descubra com Elo Plus</span><span>↗</span></button>')}if(state.view==='profile'){$('screen').insertAdjacentHTML('afterbegin',`<div class="memberbox"><h3>${planNames[membership]}</h3><p>${membership==='free'?'Conexões gratuitas. Extras quando fizer sentido.':'Benefícios ativos nesta demonstração.'}</p><button class="primary" onclick="go('plans')">${membership==='free'?'Conhecer planos':'Comparar planos'}</button> <button class="smallbutton" onclick="managePlan()">Gerenciar</button></div><div class="setting-line"><span>Modo discreto <span class="lock">Premium</span></span><button class="secondary" onclick="toggleIncognito()">${incognito?'Desativar':'Ativar'}</button></div><div class="setting-line"><span>Destaque semanal <span class="lock">Premium</span></span><button class="secondary" onclick="useBoost()">${boostUsed?'Utilizado':'Usar'}</button></div>`)} };

const dailyLimits={free:20,plus:100,premium:200};
let usedLikes=0,likeDay=dayKey(),likedToday=new Set();
let myProfile={age:28,gender:'Prefiro não informar',smoking:'Não fumo',children:'Não tenho filhos',drinking:'Socialmente',intent:'Relacionamento',bio:'Gosto de conhecer lugares novos e de uma boa conversa.',interests:'Café, música, viagens',height:'',work:'',education:'',pets:'Gosto de animais'};
people.forEach((p,i)=>Object.assign(p,{smoking:i===2?'Fumo às vezes':'Não fumo',children:i===1?'Tenho filhos':'Não tenho filhos',drinking:i===3?'Não bebo':'Socialmente',height:[168,181,165,176][i],work:['Designer','Engenheiro','Professora','Fotógrafo'][i],education:'Ensino superior',pets:['Tenho gato','Tenho cachorro','Gosto de animais','Não tenho pets'][i]}));
function dayKey(){return new Intl.DateTimeFormat('en-CA',{timeZone:'America/Sao_Paulo',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date())}
function refreshDay(){if(likeDay!==dayKey()){likeDay=dayKey();usedLikes=0;likedToday.clear()}}
function limitInfo(){refreshDay();return `${Math.max(0,dailyLimits[membership]-usedLikes)} de ${dailyLimits[membership]} curtidas disponíveis hoje`}
function trialNotice(){modal('<div class="eyebrow">Dê tempo às conexões</div><h2>Experimente por pelo menos 2 dias.</h2><p>Sugerimos manter o app instalado por pelo menos dois dias e voltar para explorar novos perfis. As pessoas entram em horários diferentes.</p><p>É uma sugestão de uso, não uma espera obrigatória nem garantia de curtidas ou matches. Não é preciso deixar o aplicativo aberto.</p><button class="primary" onclick="closeModal()">Entendi</button>')}
const originalReact=react;
react=function(id,like){refreshDay();if(like&&!likedToday.has(id)){if(usedLikes>=dailyLimits[membership]){modal(`<h2>Por hoje, você chegou ao limite.</h2><p>Você usou ${usedLikes} curtidas. Seu plano permite ${dailyLimits[membership]} por dia.</p><p>O saldo renova à meia-noite, no horário de Brasília. Passar perfis e conversar com seus matches continua disponível.</p><button class="primary" onclick="visitPlans()">Ver limites dos planos</button><button class="smallbutton" onclick="closeModal()">Continuar no meu plano</button>`);return}usedLikes++;likedToday.add(id)}originalReact(id,like)};
function profileFacts(p){return `<div class="facts"><span>🚬 ${esc(p.smoking)}</span><span>♧ ${esc(p.children)}</span><span>◇ ${esc(p.drinking)}</span><span>↕ ${p.height?esc(p.height)+' cm':'Não informado'}</span><span>⌂ ${esc(p.work||'Profissão não informada')}</span><span>✦ ${esc(p.education||'Escolaridade não informada')}</span><span>♡ ${esc(p.pets)}</span></div>`}
detail=function(id){let p=people.find(x=>x.id===id);modal(`<h2>${p.name}, ${p.age}</h2><div style="height:220px;overflow:hidden;border-radius:18px">${pic(p)}</div><p><b>${esc(p.intent)}</b></p><h3>Sobre mim</h3><p>${esc(p.bio)}</p><h3>O que eu gosto</h3><div class="tags">${p.tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join('')}</div><h3>Meu jeito de viver</h3>${profileFacts(p)}<p class="sub">Informações declaradas pelo perfil fictício.</p><button class="primary" onclick="closeModal();react(${id},true)">Curtir perfil</button><button class="smallbutton" onclick="safety(${id})">Bloquear ou denunciar</button>`)};
function options(arr,value){return arr.map(v=>`<option ${v===value?'selected':''}>${esc(v)}</option>`).join('')}
function editFullProfile(){modal(`<h2>Seu perfil, seu jeito.</h2><p class="sub">Dados opcionais podem ficar como “Prefiro não informar”. Idade pública; data de nascimento privada no app final.</p><form onsubmit="saveFullProfile(event)"><label for="editage">Idade (18+)</label><input id="editage" type="number" min="18" max="100" required value="${myProfile.age}"><label for="editgender">Gênero</label><select id="editgender">${options(['Mulher','Homem','Não binário','Outra identidade','Prefiro não informar'],myProfile.gender)}</select><label for="editintent">O que procura</label><select id="editintent">${options(['Relacionamento','Conhecer pessoas','Algo casual','Ainda estou descobrindo'],myProfile.intent)}</select><label for="editbio">Descrição</label><textarea id="editbio" maxlength="500">${esc(myProfile.bio)}</textarea><label for="editinterests">O que gosta (separado por vírgulas, até 8)</label><input id="editinterests" maxlength="180" value="${esc(myProfile.interests)}"><label for="editsmoking">Você fuma?</label><select id="editsmoking">${options(['Não fumo','Fumo às vezes','Fumo','Estou parando','Prefiro não informar'],myProfile.smoking)}</select><label for="editchildren">Filhos</label><select id="editchildren">${options(['Não tenho filhos','Tenho filhos','Prefiro não informar'],myProfile.children)}</select><label for="editdrinking">Bebidas alcoólicas</label><select id="editdrinking">${options(['Não bebo','Socialmente','Bebo','Prefiro não informar'],myProfile.drinking)}</select><label for="editheight">Altura em cm (opcional)</label><input id="editheight" type="number" min="100" max="250" value="${esc(myProfile.height)}"><label for="editwork">Profissão (opcional)</label><input id="editwork" maxlength="60" value="${esc(myProfile.work)}"><label for="editeducation">Escolaridade (opcional)</label><input id="editeducation" maxlength="60" value="${esc(myProfile.education)}"><label for="editpets">Pets</label><select id="editpets">${options(['Gosto de animais','Tenho cachorro','Tenho gato','Tenho outros pets','Não tenho pets','Prefiro não informar'],myProfile.pets)}</select><p class="sub">Demonstração: as alterações ficam nesta sessão.</p><button class="primary" type="submit">Salvar perfil completo</button></form>`)}
function saveFullProfile(e){e.preventDefault();for(let k of Object.keys(myProfile))myProfile[k]=$('edit'+k).value.trim();myProfile.age=Number(myProfile.age);myProfile.interests=myProfile.interests.split(',').map(v=>v.trim()).filter(Boolean).slice(0,8).join(', ');closeModal();go('profile');toast('Perfil atualizado nesta sessão.')}
function popularity(){modal(`<div class="eyebrow">Só você vê</div><h2>Sua popularidade</h2><p>Acompanhe a atividade do seu perfil nos últimos 7 dias.</p><div class="stats"><div><b>0</b><small>Visitas</small></div><div><b>${people.filter(p=>p.mutual&&!state.blocked.includes(p.id)).length}</b><small>Curtidas</small></div><div><b>${state.matches.length}</b><small>Matches</small></div></div><p class="demo-label">Dados fictícios da demonstração. Visitas não são rastreadas.</p><h3>Ainda conhecendo seu ritmo</h3><p>Com pouco histórico, não mostramos uma classificação. No app real, os primeiros dois dias ajudam a reunir atividade, mas o volume de pessoas na região também influencia.</p><p class="sub">Não é uma nota de beleza, não garante visibilidade e não aparece para outros perfis. Comprar um plano não aumenta artificialmente este indicador.</p><button class="primary" onclick="closeModal();editFullProfile()">Completar meu perfil</button>`)}
const plansRender=render;
render=function(){refreshDay();plansRender();if(state.view==='discover'){let a=$('screen').querySelector('.actions');if(a)a.insertAdjacentHTML('afterend',`<button class="like-count" onclick="go('plans')">${limitInfo()}</button>`);let c=$('screen').querySelector('.card');let p=candidates()[0];if(c&&p)c.insertAdjacentHTML('beforeend',`<button class="profile-open" onclick="detail(${p.id})" aria-label="Ver perfil completo de ${p.name}">ⓘ</button>`);$('screen').insertAdjacentHTML('afterbegin','<button class="two-days" onclick="trialNotice()">✦ Dê tempo às conexões: experimente por 2 dias <span>↗</span></button>')}if(state.view==='profile'){$('screen').insertAdjacentHTML('afterbegin',`<div class="profile-summary"><h2>${esc(state.name)}, ${myProfile.age}</h2><p>${esc(myProfile.bio)}</p><div class="tags">${myProfile.interests.split(',').filter(Boolean).map(t=>'<span class="tag">'+esc(t.trim())+'</span>').join('')}</div><p class="sub">${esc(myProfile.smoking)} · ${esc(myProfile.children)}</p><button class="primary" onclick="editFullProfile()">Editar perfil completo</button><button class="smallbutton" onclick="popularity()">Minha popularidade ↗</button></div>`);let paragraphs=$('screen').querySelectorAll('p');paragraphs.forEach(p=>{if(p.textContent.includes('Seu perfil de demonstração tem 28 anos.'))p.textContent=`Olá, ${state.name}. Seu perfil de demonstração tem ${myProfile.age} anos.`})}if(state.view==='plans'){$('screen').querySelector('.pricecard.plus ul').insertAdjacentHTML('afterbegin','<li>100 curtidas por dia</li>');$('screen').querySelector('.pricecard.premium ul').insertAdjacentHTML('afterbegin','<li>200 curtidas por dia</li>');$('screen').querySelector('.free-summary p').insertAdjacentHTML('afterbegin','20 curtidas por dia. ');$('screen').querySelector('.compare').insertAdjacentHTML('beforeend','<tr><td>Curtidas por dia</td><td>20</td><td>100</td><td>200</td></tr>')}};
render();
</script></body></html>
