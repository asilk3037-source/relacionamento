name: Publicar vitrine no GitHub Pages
on:
  push:
    branches: [main, ccr-2eb4e0a7-pmgeas]
    paths: ['docs/**', 'scripts/build-pages.sh', 'public/assets/art/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Instalar pandoc
        run: sudo apt-get update -y && sudo apt-get install -y pandoc
      - name: Gerar site
        run: bash scripts/build-pages.sh
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
