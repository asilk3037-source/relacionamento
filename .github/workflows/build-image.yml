name: Construir imagem Docker
on:
  push:
    branches: [main, ccr-2eb4e0a7-pmgeas]
    paths: ['server/**', 'public/**', 'Dockerfile', 'package*.json', '.github/workflows/build-image.yml']
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/asilk3037-source/relacionamento:latest
            ghcr.io/asilk3037-source/relacionamento:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/asilk3037-source/relacionamento
